const pname = id => (S.players.find(p=>p.id===id)||{name:"?"}).name;

function cleanup(){
  try{peer&&peer.destroy()}catch(e){}
  peer=null;conn=null;conns={};S=null;H=null;role=null;lost=false;mine=null;status="";ss.del("ex_room");
}
function fail(m){cleanup();err=m;render()}

/* ---------- Host (hält den Spielstand) ---------- */
function hostRoom(name){
  role="host";status="Raum wird erstellt …";err="";render();
  const code=genCode();
  const p=new Peer("exposed-"+code,OPTS);peer=p;
  p.on("open",()=>{
    S={code,hostPid:pid,phase:"lobby",players:[{id:pid,name,online:true}],mode:"gossip",cats:Object.keys(CATS),rounds:10,passes:1,pass:0,nsub:0,round:null,card:null,answered:[],reveal:null};
    H={answers:{},pool:[],idx:0,timer:null,subs:{},cards:[],ci:0};
    status="";bc();
  });
  p.on("connection",c=>{
    c.on("data",d=>onHost(c,d));
    c.on("close",()=>drop(c));
    c.on("error",()=>drop(c));
  });
  p.on("disconnected",()=>{try{p.reconnect()}catch(e){}});
  p.on("error",e=>{
    if(e.type==="unavailable-id"){try{p.destroy()}catch(x){}hostRoom(name)}
    else if(e.type!=="peer-unavailable") fail("Verbindungsfehler ("+e.type+")");
  });
}
function bc(){
  if(role==="host") for(const id in conns){try{conns[id].send({t:"s",s:S})}catch(e){}}
  render();
}
function onHost(c,d){
  if(!d||typeof d!=="object")return;
  if(d.t==="hello"){return join(c,d)}
  if(c._pid) act(c._pid,d);
}
function join(c,d){
  const name=String(d.name||"").trim().slice(0,16),id=String(d.pid||"").slice(0,20);
  if(!name||!id||!S)return;
  let pl=S.players.find(x=>x.id===id);
  if(!pl){
    if(S.phase!=="lobby"){c.send({t:"err",m:"Das Spiel läuft schon. Warte auf die nächste Runde."});return}
    if(S.players.length>=12){c.send({t:"err",m:"Der Raum ist voll (12 Spieler)."});return}
    if(S.players.some(x=>x.name.toLowerCase()===name.toLowerCase())){c.send({t:"err",m:"Dieser Name ist im Raum schon vergeben."});return}
    pl={id,name,online:true};S.players.push(pl);
  }
  if(conns[id]&&conns[id]!==c){try{conns[id]._pid=null;conns[id].close()}catch(e){}}
  pl.online=true;c._pid=id;conns[id]=c;bc();
}
function drop(c){
  const id=c._pid;if(!id||conns[id]!==c||!S)return;
  delete conns[id];
  if(S.phase==="lobby") S.players=S.players.filter(p=>p.id!==id);
  else {const pl=S.players.find(p=>p.id===id);if(pl)pl.online=false;}
  checkAll();checkSubs();bc();
}
const required = () => S.players.filter(p=>p.online).map(p=>p.id);
function checkAll(){
  if(S.phase!=="answer"||H.pending)return;
  if(required().every(id=>id in H.answers)){
    H.pending=true;const idx=S.round.idx;
    setTimeout(()=>{H.pending=false;if(S.phase==="answer"&&S.round.idx===idx)doReveal()},700);
  }
}
const clip = s => String(s||"").trim().slice(0,140);
function act(p,d){
  if(!S||!S.players.some(x=>x.id===p))return;
  const host=p===S.hostPid;
  switch(d.t){
    case "set":
      if(!host||S.phase!=="lobby")return;
      if(d.mode in MODES)S.mode=d.mode;
      if(Array.isArray(d.cats))S.cats=d.cats.filter(k=>k in CATS);
      if([5,10,15,20,30].includes(d.rounds))S.rounds=d.rounds;
      if([1,2,3].includes(d.passes))S.passes=d.passes;
      bc();break;
    case "start":
      if(host&&S.phase==="lobby")startGame();break;
    case "ans":
      if(S.phase!=="answer"||!S.players.some(x=>x.id===d.v)||d.v===p)return;
      H.answers[p]=d.v;S.answered=Object.keys(H.answers);checkAll();bc();break;
    case "reveal":
      if(host&&S.phase==="answer")doReveal();break;
    case "next":
      if(host&&S.phase==="reveal")nextRound();break;
    case "sub":{
      if(S.phase!=="write")return;
      const k=d.kind,tx=clip(d.text);
      if(!["challenge","question","gossip"].includes(k)||d.target===p||!S.players.some(x=>x.id===d.target)||!tx)return;
      (H.subs[p]=H.subs[p]||{})[k]={target:d.target,text:tx};
      S.nsub=Object.values(H.subs).reduce((n,s)=>n+Object.keys(s).length,0);
      S.answered=Object.keys(H.subs).filter(id=>{const s=H.subs[id];return s.challenge&&s.question&&s.gossip});
      checkSubs();bc();break}
    case "go":
      if(host&&S.phase==="write")startCards();break;
    case "gnext":
      if(host&&S.phase==="card")cardAdvance();break;
    case "again":
      if(host&&S.phase==="end"){clearTimeout(H.timer);S.phase="lobby";S.round=null;S.card=null;S.reveal=null;S.answered=[];S.players=S.players.filter(x=>x.online);bc()}break;
  }
}
function startGame(){
  const on=S.players.filter(p=>p.online);
  if(on.length<3||!S.cats.length)return;
  S.players=on;
  if(S.mode==="gossip"){S.pass=0;return startWrite()}
  const pool=[];
  S.cats.forEach(k=>CATS[k].q.forEach(q=>pool.push({cat:k,text:q})));
  H.pool=shuffle(pool).slice(0,S.rounds);H.idx=-1;S.total=H.pool.length;
  nextRound();
}
/* Gossip Wheel: alle schreiben, dann werden die Karten nacheinander aufgedeckt */
function startWrite(){
  H.subs={};H.pending=false;S.answered=[];S.nsub=0;S.card=null;S.phase="write";bc();
}
function checkSubs(){
  if(S.phase!=="write"||H.pending)return;
  const req=required();
  if(req.length&&req.every(id=>S.answered.includes(id))){
    H.pending=true;
    setTimeout(()=>{H.pending=false;if(S.phase==="write")startCards()},1200);
  }
}
function startCards(){
  const cs=[];
  Object.values(H.subs).forEach(s=>Object.keys(s).forEach(k=>{
    if(S.players.some(x=>x.id===s[k].target))cs.push({kind:k,target:s[k].target,text:s[k].text});
  }));
  if(!cs.length)return;
  H.cards=shuffle(cs);H.ci=-1;cardAdvance();
}
function cardAdvance(){
  H.ci++;
  if(H.ci>=H.cards.length){
    S.pass++;
    if(S.pass<S.passes)return startWrite();
    S.phase="end";S.card=null;S.answered=[];return bc();
  }
  const c=H.cards[H.ci];
  S.phase="card";
  S.card={i:H.ci,n:H.cards.length,pass:S.pass,target:c.target,kind:c.kind,text:c.text};
  S.answered=[];bc();
}
/* Wer am ehesten */
function nextRound(){
  H.idx++;H.answers={};H.pending=false;S.answered=[];S.reveal=null;
  if(H.idx>=H.pool.length){S.phase="end";S.round=null;return bc()}
  const it=H.pool[H.idx];
  S.round={idx:H.idx,type:"likely",cat:it.cat,text:it.text};S.phase="answer";bc();
}
function doReveal(){
  const ans=H.answers,counts={};
  Object.values(ans).forEach(v=>{if(S.players.some(x=>x.id===v))counts[v]=(counts[v]||0)+1});
  const max=Math.max(0,...Object.values(counts));
  const winners=max?Object.keys(counts).filter(k=>counts[k]===max):[];
  S.reveal={counts,winners};S.phase="reveal";bc();
}

/* ---------- Client ---------- */
function joinRoom(code,name){
  role="client";status="Verbinde …";err="";lost=false;render();
  ss.set("ex_room",JSON.stringify({code,name}));
  const p=new Peer(OPTS);peer=p;
  const timer=setTimeout(()=>{if(!S&&peer===p)fail("Raum nicht erreichbar. Code prüfen und erneut versuchen.")},15000);
  p.on("open",()=>{
    const c=p.connect("exposed-"+code,{reliable:true});conn=c;
    c.on("open",()=>c.send({t:"hello",pid,name}));
    c.on("data",d=>{
      if(!d)return;
      if(d.t==="s"){clearTimeout(timer);S=d.s;status="";lost=false;render()}
      else if(d.t==="err"){clearTimeout(timer);fail(d.m)}
    });
    c.on("close",()=>{if(role==="client"&&conn===c){lost=true;render()}});
  });
  p.on("error",e=>{clearTimeout(timer);if(peer===p)fail(e.type==="peer-unavailable"?"Raum nicht gefunden. Code prüfen.":"Verbindungsfehler ("+e.type+")")});
}
function send(m){
  if(role==="host")act(pid,m);
  else if(conn&&conn.open)conn.send(m);
}

/* ---------- Ansichten ---------- */
const me = () => S&&S.players.find(p=>p.id===pid);
const isHost = () => S&&S.hostPid===pid;
function header(){
  return `<header><b>EXPOSED</b><span>${S?`Raum ${esc(S.code)} · `:""}<button class="link" data-a="leave">Verlassen</button></span></header>`;
}
function vHome(){
  const q=new URLSearchParams(location.search).get("r")||"";
  return `<h1>Exposed</h1><p class="mut">Gossip-Partyspiel für die Gruppe. Jeder spielt auf dem eigenen Handy.</p>
  ${err?`<div class="err">${esc(err)}</div>`:""}
  <div class="card stack"><input type="text" id="nm" maxlength="16" placeholder="Dein Name" value="${esc(myName)}" autocomplete="off">
    <button class="btn" data-a="create">Raum erstellen</button></div>
  <div class="card stack"><h2>Raum beitreten</h2>
    <input type="text" id="cd" maxlength="4" placeholder="Code" value="${esc(q.toUpperCase().slice(0,4))}" autocapitalize="characters" autocomplete="off" style="text-transform:uppercase;letter-spacing:.2em">
    <button class="btn sec" data-a="join">Beitreten</button></div>`;
}
function vLobby(){
  const h=isHost(),on=S.players.filter(p=>p.online).length;
  const link=location.origin+location.pathname+"?r="+S.code;
  let h2=`${header()}<div class="card"><p class="mut c" style="font-size:13px">Raum-Code</p><div class="code">${esc(S.code)}</div>
    <div class="row" style="margin-top:12px"><button class="btn sec" data-a="share">Link teilen</button></div></div>
  <div class="card"><h2>Spieler (${S.players.length})</h2>${S.players.map(p=>`<div class="pl"><span><span class="dot ${p.online?"":"off"}"></span>${esc(p.name)}${p.id===S.hostPid?' <span class="mut">· Host</span>':""}</span></div>`).join("")}
    ${on<3?`<p class="mut" style="margin-top:10px;font-size:14px">Mindestens 3 Spieler nötig.</p>`:""}</div>`;
  if(h){
    h2+=`<div class="card stack"><h2>Modus</h2><div class="seg">${Object.entries(MODES).map(([k,n])=>`<button class="${S.mode===k?"on":""}" data-a="mode" data-v="${k}">${n}</button>`).join("")}</div>
    <p class="mut" style="font-size:14px">${S.mode==="gossip"?"Alle schreiben gleichzeitig: erst eine Person wählen und ihr eine Challenge geben, dann eine Frage, dann ein Gerücht. Danach wird Karte für Karte aufgedeckt (ohne Absender), der Host drückt Weiter. Wer nicht ehrlich antwortet oder die Challenge nicht macht, trinkt.":"Alle wählen geheim, wer am ehesten zur Frage passt. Wer am häufigsten gewählt wird, trinkt."}</p>
    ${S.mode==="gossip"?`<h2 style="margin-top:6px">Durchgänge</h2><div class="seg">${[1,2,3].map(n=>`<button class="${S.passes===n?"on":""}" data-a="passes" data-v="${n}">${n}</button>`).join("")}</div>`:`<h2 style="margin-top:6px">Runden</h2><div class="seg">${[5,10,15,20,30].map(n=>`<button class="${S.rounds===n?"on":""}" data-a="rounds" data-v="${n}">${n}</button>`).join("")}</div>`}</div>
    <div class="card stack"><h2>Kategorien</h2>${Object.entries(CATS).map(([k,c])=>`<button class="opt ${S.cats.includes(k)?"on":""}" data-a="cat" data-v="${k}"><span>${esc(c.n)}<br><small>${esc(c.d)}</small></span><span>${S.cats.includes(k)?"✓":""}</span></button>`).join("")}
      <div class="row"><button class="btn sec" data-a="allcats">Alle</button><button class="btn sec" data-a="nocats">Keine</button></div></div>
    <button class="btn" data-a="start" ${on<3||!S.cats.length?"disabled":""}>Spiel starten</button>`;
  } else {
    h2+=`<div class="card"><h2>Einstellungen</h2><p>${esc(MODES[S.mode])} · ${S.mode==="gossip"?S.passes+(S.passes>1?" Durchgänge":" Durchgang"):S.rounds+" Runden"}</p><p class="mut" style="font-size:14px;margin-top:4px">${S.cats.map(k=>esc(CATS[k].n)).join(", ")||"Keine Kategorie"}</p></div>
    <p class="mut c">Warte, bis ${esc(pname(S.hostPid))} das Spiel startet …</p>`;
  }
  return h2;
}
function rhead(){
  const r=S.round;
  return `${header()}<div class="prog"><i style="width:${r.idx/S.total*100}%"></i></div>
  <div class="tag">Runde ${r.idx+1} / ${S.total} · ${esc(CATS[r.cat].n)} · Wer am ehesten</div>`;
}
const KINDS=[{k:"challenge",n:"Challenge",f:"Aufgabe für"},{k:"question",n:"Frage",f:"Frage an"},{k:"gossip",n:"Gerücht",f:"Gerücht über"}];
const KCARD={challenge:{l:"Challenge für",r:"Machen oder trinken."},question:{l:"Frage an",r:"Ehrlich antworten oder trinken."},gossip:{l:"Gerücht über",r:"Stimmt es? Ehrlich sagen oder trinken."}};
let draft={key:""};
function newDraft(key){return {key,stage:0,target:null,text:""}}
function wstText(){
  const req=required(),got=S.answered.filter(id=>req.includes(id)).length;
  return {got,txt:`${got} / ${req.length} fertig`};
}
function vWrite(){
  const key=S.code+S.pass;if(draft.key!==key)draft=newDraft(key);
  const w=wstText(),tag=`<div class="tag">Gossip Wheel${S.passes>1?` · Durchgang ${S.pass+1} / ${S.passes}`:""}</div>`;
  const foot=`<p class="c mut" id="wst" style="font-size:14px">${w.txt}</p>
  ${isHost()?`<button class="btn sec" id="gob" data-a="go" ${S.nsub?"":"disabled"}>Weiter zu den Karten</button>`:""}`;
  if(draft.stage>=3)return `${header()}${tag}<div class="grow stack" style="justify-content:center"><div class="card c"><p style="font-size:20px;font-weight:700">Fertig</p><p class="mut" style="font-size:14px">Warte auf die anderen …</p></div></div>${foot}`;
  const K=KINDS[draft.stage],others=S.players.filter(p=>p.id!==pid),n=others.length;
  const t=others.find(p=>p.id===draft.target);
  const ring=others.map((p,i)=>{
    const a=2*Math.PI*i/n-Math.PI/2,nm=p.name.length>9?p.name.slice(0,8)+"…":p.name;
    return `<button class="av ${p.id===draft.target?"on":""}" data-a="pick" data-v="${esc(p.id)}" style="left:${(50+39*Math.cos(a)).toFixed(1)}%;top:${(50+39*Math.sin(a)).toFixed(1)}%"><i>${esc(p.name[0].toUpperCase())}</i><span>${esc(nm)}</span></button>`;
  }).join("");
  const form=t?`<div class="card stack"><h2>${K.f} ${esc(t.name)}</h2>
    <textarea id="ft" maxlength="140" placeholder="${K.n} schreiben …">${esc(draft.text)}</textarea>
    <div class="row"><button class="btn sec" data-a="fill">Zufall</button><button class="btn" id="sb" data-a="sendsub" ${draft.text.trim()?"":"disabled"}>Senden</button></div></div>`
    :`<p class="c mut">Tippe auf eine Person.</p>`;
  return `${header()}${tag}<div class="tag" style="color:var(--text)">Schritt ${draft.stage+1} / 3 · ${K.n}</div>
  <div class="ring"><div class="mid">Wer?</div>${ring}</div>${form}${foot}`;
}
function vCard(){
  const c=S.card,tg=c.target===pid,K=KCARD[c.kind];
  const last=c.i+1>=c.n;
  return `${header()}<div class="tag">Gossip Wheel · Karte ${c.i+1} / ${c.n}${S.passes>1?` · Durchgang ${c.pass+1} / ${S.passes}`:""}</div>
  <div class="card c"><p class="mut" style="font-size:13px">${K.l}</p><p style="font-size:34px;font-weight:700">${tg?"dich":esc(pname(c.target))}</p></div>
  <div class="blk"><label>${KINDS.find(x=>x.k===c.kind).n} · anonym</label><p>${esc(c.text)}</p><p class="mut" style="font-size:14px;font-weight:400;margin-top:4px">${K.r}</p></div>
  <div class="grow"></div>
  ${isHost()?`<button class="btn" data-a="gnext">${last?(S.pass+1<S.passes?"Nächster Durchgang":"Fertig"):"Weiter"}</button>`:`<p class="mut c">Warte auf ${esc(pname(S.hostPid))} …</p>`}`;
}
function vAnswer(){
  const r=S.round,need=required().length,got=S.answered.filter(id=>required().includes(id)).length;
  const done=S.answered.includes(pid);
  const body=`<div class="q">${esc(r.text)}</div><div class="grid">${S.players.filter(p=>p.id!==pid).map(p=>`<button class="opt big ${mine===p.id?"on":""} ${p.online?"":"mut"}" data-a="ans" data-v="${esc(p.id)}">${esc(p.name)}</button>`).join("")}</div>`;
  return `${rhead()}<div class="grow stack" style="justify-content:center">${body}
  <p class="c mut" style="font-size:14px">${done?"Antwort gespeichert (du kannst sie noch ändern). ":""}${got} / ${need} haben geantwortet</p></div>
  ${isHost()?`<button class="btn sec" data-a="reveal" ${got?"":"disabled"}>Jetzt auflösen</button>`:""}`;
}
function vReveal(){
  const r=S.round,v=S.reveal;
  const rows=S.players.map(p=>[p,v.counts[p.id]||0]).sort((a,b)=>b[1]-a[1]);
  const max=rows[0][1];
  const last=r.idx+1>=S.total;
  return `${rhead()}<div class="stack"><div class="q" style="font-size:20px">${esc(r.text)}</div>
  <div class="card c"><p class="mut" style="font-size:13px">Trinkt</p><p style="font-size:30px;font-weight:700">${v.winners.length?v.winners.map(id=>esc(pname(id))).join(" & "):"Niemand"}</p>${max?`<p class="mut" style="font-size:14px">${max} ${max===1?"Schluck":"Schlücke"}</p>`:""}</div>
  <div class="card">${rows.map(([p,c])=>`<div class="bar ${c===max&&c>0?"top":""}"><div class="l"><span>${esc(p.name)}</span><span>${c}</span></div><div class="b"><i data-w="${max?c/max*100:0}"></i></div></div>`).join("")}</div></div>
  ${isHost()?`<button class="btn" data-a="next">${last?"Fertig":"Weiter"}</button>`:`<p class="mut c">Warte auf ${esc(pname(S.hostPid))} …</p>`}`;
}
function vEnd(){
  return `${header()}<h1 style="margin-top:12px">Prost.</h1><p class="mut">Das war die Runde. Nochmal oder was anderes?</p>
  <div class="grow"></div>
  ${isHost()?`<button class="btn" data-a="again">Zurück zur Lobby</button>`:`<p class="mut c">Warte auf ${esc(pname(S.hostPid))} …</p>`}`;
}
function render(force){
  if(!force&&S&&S.phase==="write"&&render.w===S.code+S.pass&&document.getElementById("wst")){
    const w=wstText();document.getElementById("wst").textContent=w.txt;
    const g=document.getElementById("gob");if(g)g.disabled=!S.nsub;
    return;
  }
  let html;
  if(!role) html=vHome();
  else if(!S) html=`${header()}<p class="c mut" style="margin-top:40px">${esc(status||"Verbinde …")}</p>`;
  else {
    if(S.phase==="lobby")html=vLobby();
    else if(S.phase==="write")html=vWrite();
    else if(S.phase==="card")html=vCard();
    else if(S.phase==="answer")html=vAnswer();
    else if(S.phase==="reveal")html=vReveal();
    else html=vEnd();
    if(lost)html=`<div class="err">Verbindung verloren. <button class="link" data-a="reconnect" style="color:var(--text);text-decoration:underline">Neu verbinden</button></div>`+html;
  }
  const key=S?S.code+S.phase+(S.round?S.round.idx:"")+(S.card?S.card.i:"")+(S.pass||""):"";
  if(mine!==null&&render.k!==key)mine=null;
  render.k=key;
  render.w=S&&S.phase==="write"?S.code+S.pass:"";
  $app.innerHTML=html;
  if(S&&S.phase==="reveal")requestAnimationFrame(()=>requestAnimationFrame(()=>$app.querySelectorAll("[data-w]").forEach(e=>e.style.width=e.dataset.w+"%")));
}

/* ---------- Aktionen ---------- */
const A = {
  create(){const n=document.getElementById("nm").value.trim();if(!n)return;myName=n;ls.set("ex_name",n);hostRoom(n)},
  join(){const n=document.getElementById("nm").value.trim(),c=document.getElementById("cd").value.trim().toUpperCase();
    if(!n){err="Bitte Namen eingeben.";return render()}
    if(c.length!==4){err="Der Code hat 4 Buchstaben.";return render()}
    myName=n;ls.set("ex_name",n);joinRoom(c,n)},
  leave(){if(S&&role==="host"&&!confirm("Raum schließen? Das beendet das Spiel für alle."))return;cleanup();err="";render()},
  reconnect(){const r=JSON.parse(ss.get("ex_room")||"null");if(!r)return;try{peer&&peer.destroy()}catch(e){}S=null;joinRoom(r.code,r.name)},
  mode(d){send({t:"set",mode:d.v,cats:S.cats,rounds:S.rounds})},
  rounds(d){send({t:"set",mode:S.mode,cats:S.cats,rounds:+d.v})},
  cat(d){const c=S.cats.includes(d.v)?S.cats.filter(k=>k!==d.v):[...S.cats,d.v];send({t:"set",mode:S.mode,cats:c,rounds:S.rounds})},
  allcats(){send({t:"set",mode:S.mode,cats:Object.keys(CATS),rounds:S.rounds})},
  nocats(){send({t:"set",mode:S.mode,cats:[],rounds:S.rounds})},
  passes(d){send({t:"set",mode:S.mode,cats:S.cats,rounds:S.rounds,passes:+d.v})},
  start(){send({t:"start"})},
  pick(d){draft.target=d.v;render(true)},
  fill(){
    const K=KINDS[draft.stage],k=pick(S.cats),nm=draft.target?pname(draft.target):"";
    draft.text=K.k==="challenge"?pick(CHAL[k]):K.k==="question"?pick(QS[k]):pick(RUM[k]).replace("{n}",nm);
    render(true)},
  sendsub(){
    if(!draft.target||!draft.text.trim())return;
    send({t:"sub",kind:KINDS[draft.stage].k,target:draft.target,text:draft.text});
    draft.stage++;draft.target=null;draft.text="";render(true)},
  go(){send({t:"go"})},
  gnext(){send({t:"gnext"})},
  ans(d){mine=d.v;send({t:"ans",v:d.v});if(role==="client")render()},
  reveal(){send({t:"reveal"})},
  next(){send({t:"next"})},
  again(){send({t:"again"})},
  async share(){
    const url=location.origin+location.pathname+"?r="+S.code,text="Komm in meinen Exposed-Raum: "+S.code;
    try{if(navigator.share){await navigator.share({title:"Exposed",text,url});return}}catch(e){if(e&&e.name==="AbortError")return}
    try{await navigator.clipboard.writeText(url);alert("Link kopiert.")}catch(e){prompt("Link kopieren:",url)}
  }
};
$app.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b&&!b.disabled&&A[b.dataset.a])A[b.dataset.a](b.dataset)});
$app.addEventListener("input",e=>{
  if(e.target.id!=="ft")return;
  draft.text=e.target.value;
  const b=document.getElementById("sb");if(b)b.disabled=!draft.text.trim();
});
$app.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="cd")A.join()});

render();
(function(){const r=JSON.parse(ss.get("ex_room")||"null");if(r&&r.code&&r.name)joinRoom(r.code,r.name)})();
</script>
