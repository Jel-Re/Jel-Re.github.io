<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9D%93%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="wrap">

  <div id="loading" class="card center">
    <p class="muted">Quiz wird geladen …</p>
  </div>

  <!-- Kein Quiz aktiv / Fehler -->
  <div id="screen-empty" class="card center hidden">
    <h1 id="empty-title">Gerade läuft kein Quiz</h1>
    <p class="muted" id="empty-text">
      Im Admin-Panel kann ein Quiz erstellt und aktiviert werden.
      Danach startet es hier automatisch.
    </p>
    <p><a href="admin.html">Zum Admin-Panel</a></p>
  </div>

  <!-- Startbildschirm mit Namenseingabe -->
  <div id="screen-start" class="card hidden">
    <h1 id="start-title"></h1>
    <p id="start-description" class="muted"></p>
    <p class="muted" id="start-meta"></p>

    <form id="start-form">
      <div class="field">
        <label for="player-name">Dein Name</label>
        <input type="text" id="player-name" maxlength="60" autocomplete="name"
               placeholder="z. B. Alex" required>
      </div>
      <p id="start-error" class="notice error hidden"></p>
      <button type="submit" class="btn primary block">Quiz starten</button>
    </form>
  </div>

  <!-- Laufendes Quiz -->
  <div id="screen-play" class="card hidden">
    <div class="progress"><span id="progress-bar" style="width:0%"></span></div>
    <p class="muted" id="play-counter"></p>
    <h2 id="play-question"></h2>
    <div id="play-answers"></div>
  </div>

  <!-- Ergebnis -->
  <div id="screen-done" class="card hidden">
    <h1>Geschafft!</h1>
    <p id="done-greeting" class="muted"></p>
    <p class="score-big" id="done-score"></p>
    <p class="muted" id="done-percent"></p>
    <p id="done-saved" class="muted"></p>
    <h3 style="margin-top:1.5rem">Deine Antworten</h3>
    <div id="done-review"></div>
    <p style="margin-top:1.5rem">
      <button type="button" class="btn" id="btn-restart">Noch einmal spielen</button>
    </p>
  </div>

</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/db.js"></script>
<script src="assets/js/quiz.js"></script>
</body>
</html>
